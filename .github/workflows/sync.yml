name: Sync GitHub Stats

on:
  # Run every 3 hours
  schedule:
    - cron: '0 */3 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      username:
        description: 'GitHub username to sync (default: PrajwalAmte)'
        required: false
        default: 'PrajwalAmte'

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Sync GitHub Stats
        run: |
          USERNAME="${{ github.event.inputs.username || 'PrajwalAmte' }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.API_URL }}/v1/sync/${USERNAME}" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Sync successful for $USERNAME"
            exit 0
          elif [ "$HTTP_CODE" -eq 409 ]; then
            echo "⚠️ Sync already running for $USERNAME"
            exit 0
          else
            echo "❌ Sync failed for $USERNAME"
            exit 1
          fi
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::GitHub Stats sync failed. Check the logs above for details."
