name: Sync GitHub Stats

on:
  # Run every 3 hours
  schedule:
    - cron: '0 */3 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      username:
        description: 'GitHub username to sync (default: PrajwalAmte)'
        required: false
        default: 'PrajwalAmte'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.API_URL }}" ]; then
            echo "::error::API_URL secret is not set (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          if [ -z "${{ secrets.SYNC_SECRET }}" ]; then
            echo "::error::SYNC_SECRET secret is not set (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Sync GitHub Stats
        run: |
          USERNAME="${{ github.event.inputs.username || 'PrajwalAmte' }}"
          API_URL="${{ secrets.API_URL }}"
          API_URL="${API_URL%/}"

          set +e
          RESPONSE=$(curl -sS -L --max-redirs 5 --connect-timeout 10 --max-time 45 \
            -w "\n%{http_code}" -X POST \
            "${API_URL}/v1/sync/${USERNAME}" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}")
          CURL_EXIT=$?
          set -e

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Sync successful for $USERNAME"
            exit 0
          elif [ "$HTTP_CODE" -eq 409 ]; then
            echo "Sync already running for $USERNAME"
            exit 0
          elif [ "$CURL_EXIT" -eq 28 ] && [ "$HTTP_CODE" = "000" ]; then
            echo "::error::curl timed out with no response — likely the DB pool hang, not a transient network issue"
            exit 1
          elif [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::curl failed with exit code $CURL_EXIT while calling ${API_URL}/v1/sync/${USERNAME}"
            exit 1
          else
            echo "Sync failed for $USERNAME"
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::GitHub Stats sync failed. Check the logs above for details."